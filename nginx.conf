# Serves both primary and legacy domains on the same app:
# - https://errayhany.com (primary / SEO canonical)
# - https://imdenmanadger.online (legacy, still active)
server {
    listen 80;
    server_name errayhany.com www.errayhany.com imdenmanadger.online www.imdenmanadger.online;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
