# Serves both primary and legacy domains on the same app:
# - https://errayhany.com (primary / SEO canonical)
# - https://imdenmanadger.online (legacy, still active)
server {
    listen 80;
    server_name errayhany.com www.errayhany.com imdenmanadger.online www.imdenmanadger.online;

    # Proxy Firebase Auth's handler pages through our own domain so the
    # sign-in redirect/popup flow is first-party (same site as the app).
    # Without this, the hidden iframe Firebase uses to relay the pending
    # sign-in result lives on imden-errayany.firebaseapp.com, a different
    # site from errayhany.com/imdenmanadger.online. Modern Chrome partitions
    # IndexedDB/storage per top-level site, so that cross-site relay silently
    # loses the auth result: the redirect to Google completes, the user is
    # sent back, but getRedirectResult() resolves with nothing and no error.
    location ^~ /__/auth/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        set $firebase_auth_backend imden-errayany.firebaseapp.com;
        proxy_pass https://$firebase_auth_backend;
        proxy_set_header Host $firebase_auth_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $firebase_auth_backend;
        proxy_set_header Accept-Encoding "";
    }

    location = /__/firebase/init.json {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        set $firebase_auth_backend imden-errayany.firebaseapp.com;
        proxy_pass https://$firebase_auth_backend;
        proxy_set_header Host $firebase_auth_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $firebase_auth_backend;
        proxy_set_header Accept-Encoding "";
    }

    # Order tracking API is colocated in this same container (see
    # docker-entrypoint-store.sh). Hardcoded — do NOT use envsubst templates
    # here: EasyPanel injects many env vars, and a failed/skipped template
    # render leaves stock nginx (SPA routes + /bot-api all 404).
    location ^~ /bot-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Optimized product images are generated during deployment. Their names
    # change with the product/image index and can stay cached for a long time.
    location /product-images/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Family hero banners
    location /banners/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Revalidate the fast catalog snapshot after each deployment.
    location = /catalog-cache.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, no-cache";
    }

    location = /product-images-manifest.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, no-cache";
    }

    # Apple Universal Links — must be served as JSON without redirects.
    location = /.well-known/apple-app-site-association {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/assetlinks.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Desktop installers
    location /downloads/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Content-Disposition "attachment";
    }

    location = /download.html {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
