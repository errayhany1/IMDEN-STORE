# Serves both primary and legacy domains on the same app:
# - https://errayhany.com (primary / SEO canonical)
# - https://imdenmanadger.online (legacy, still active)
server {
    listen 80;
    server_name errayhany.com www.errayhany.com imdenmanadger.online www.imdenmanadger.online;

    # Proxy Firebase Auth's handler pages through our own domain so the
    # sign-in redirect/popup flow is first-party (same site as the app).
    # Without this, the hidden iframe Firebase uses to relay the pending
    # sign-in result lives on imden-errayany.firebaseapp.com, a different
    # site from errayhany.com/imdenmanadger.online. Modern Chrome partitions
    # IndexedDB/storage per top-level site, so that cross-site relay silently
    # loses the auth result: the redirect to Google completes, the user is
    # sent back, but getRedirectResult() resolves with nothing and no error.
    location ^~ /__/auth/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        set $firebase_auth_backend imden-errayany.firebaseapp.com;
        proxy_pass https://$firebase_auth_backend;
        proxy_set_header Host $firebase_auth_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $firebase_auth_backend;
        proxy_set_header Accept-Encoding "";
    }

    location = /__/firebase/init.json {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        set $firebase_auth_backend imden-errayany.firebaseapp.com;
        proxy_pass https://$firebase_auth_backend;
        proxy_set_header Host $firebase_auth_backend;
        proxy_ssl_server_name on;
        proxy_ssl_name $firebase_auth_backend;
        proxy_set_header Accept-Encoding "";
    }

    # Optimized product images are generated during deployment. Their names
    # change with the product/image index and can stay cached for a long time.
    location /product-images/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Revalidate the fast catalog snapshot after each deployment.
    location = /catalog-cache.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, no-cache";
    }

    location = /product-images-manifest.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, no-cache";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
